<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a0a1a" />
  <title>Starfall: Level 1</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="game-shell" aria-label="Starfall space shooter">
    <div class="titlebar">
      <span class="eyebrow">STARFALL // SECTOR 01</span>
      <div class="title-actions"><span class="status-dot">SYSTEMS ONLINE</span><button id="fullscreenButton" class="fullscreen-button" type="button" aria-label="Toggle full screen">FULL SCREEN <span>⛶</span></button></div>
    </div>
    <div class="canvas-frame">
      <canvas id="gameCanvas" width="1280" height="720" aria-label="Starfall game canvas">
        Your browser does not support HTML5 Canvas.
      </canvas>
      <section id="mobileControls" class="mobile-controls" aria-label="Mobile game controls">
        <div class="mobile-dpad" aria-label="Movement controls">
          <button type="button" class="mobile-button dpad-up" data-action="up" aria-label="Move up">▲</button>
          <button type="button" class="mobile-button dpad-left" data-action="left" aria-label="Move left">◀</button>
          <button type="button" class="mobile-button dpad-center" aria-label="Movement pad">✦</button>
          <button type="button" class="mobile-button dpad-right" data-action="right" aria-label="Move right">▶</button>
          <button type="button" class="mobile-button dpad-down" data-action="down" aria-label="Move down">▼</button>
        </div>
        <div class="mobile-actions" aria-label="Combat controls">
          <button type="button" class="mobile-button action-forge" data-action="upgrade">FORGE</button>
          <button type="button" class="mobile-button action-arms" data-action="nextWeapon">ARMS</button>
          <button type="button" class="mobile-button action-bomb" data-action="bomb">BOMB</button>
          <button type="button" class="mobile-button action-fullscreen" data-action="fullscreen" aria-label="Full screen">⛶</button>
          <button type="button" class="mobile-button action-fire" data-action="shoot start">FIRE</button>
        </div>
      </section>
    </div>
    <aside class="rotate-device" aria-hidden="true"><span>⤾</span> ROTATE DEVICE FOR LANDSCAPE PLAY</aside>
    <p class="controls">MOVE <kbd>WASD</kbd><kbd>← ↑ ↓ →</kbd> &nbsp; FIRE / CONFIRM <kbd>SPACE</kbd> &nbsp; BOMB <kbd>X</kbd> &nbsp; WEAPONS <kbd>Q</kbd><kbd>E</kbd> &nbsp; FIELD FORGE <kbd>U</kbd> &nbsp; FULL SCREEN <kbd>F</kbd></p>
  </main>
  <script type="module" src="js/main.js"></script>
</body>
</html>
